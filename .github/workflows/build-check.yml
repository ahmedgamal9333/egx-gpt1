name: Project Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: # Added for broader compatibility with private repos
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock # Using npm as it's more common than pm

      - name: Build frontend
        run: npm run build # Using npm as it's more common than pm

      - name: TypeScript validation
        run: npm run lint
