name: Extract Project Archive
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Safely extract project archive
        shell: bash
        run: |
          set -euo pipefail
          archive='EGX_AI_Analyst_reviewed_safety_patch.zip'
          test -f "$archive"
          if unzip -Z1 "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path found in ZIP archive'
            exit 1
          fi
          unzip -o "$archive" -d .
      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit'
          else
            git commit -m 'Extract EGX AI Analyst project files'
            git push
          fi
