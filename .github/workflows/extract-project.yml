name: Extract Project Archive
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Safely extract project archive
        shell: bash
        run: |
          python3 - &lt;&lt;'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          archive = root / 'EGX_AI_Analyst_reviewed_safety_patch.zip'
          if not archive.is_file():
              raise SystemExit('Project ZIP not found')
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  target = (root / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'Unsafe archive path: {info.filename}')
              zf.extractall(root)
              print(f'Extracted {len(zf.infolist())} archive entries')
          PY
      - name: Commit extracted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit'
          else
            git commit -m 'Extract EGX AI Analyst project files'
            git push
          fi
